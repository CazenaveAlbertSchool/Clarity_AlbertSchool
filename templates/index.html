
<!DOCTYPE html>
<html>
<head>
    <title>Traitement de Documents</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Traitement de Documents</h1>
    <div id="drop-area" ondrop="dropHandler(event);" ondragover="dragOverHandler(event);">
        Glissez-déposez un fichier ici
    </div>
    <button onclick="processFiles()">Traiter les fichiers</button>
    <div id="results"></div>
    <script>
        function dragOverHandler(ev) {
            ev.preventDefault();
        }
        
        function dropHandler(ev) {
            ev.preventDefault();
            const files = ev.dataTransfer.files;
            // Logique pour uploader vers Google Drive ici
            alert(`Fichier(s) sélectionné(s): ${files.length}`);
        }
        
        async function processFiles() {
            const response = await fetch('/process', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({file_id: 'example-id', file_name: 'example.pdf'})
            });
            const result = await response.json();
            document.getElementById('results').innerText = `Document traité: ${result.document_id}`;
        }
    </script>
</body>
</html>
